<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spyglass Matrix — Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;--paper:#f5f5f4;--ink:#0a0a0a;--ink-2:#525252;--ink-3:#a3a3a3;--line:#e7e5e4;
    --navy:#0A1F3D;--navy-2:#1a3052;--amber:#C2A24C;--amber-d:#A6862F;--forest:#2F4D3A;--cream:#F5EFE0;
    --font:'Geist',-apple-system,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;--serif:'Newsreader',Georgia,serif;
    --sh:0 12px 32px rgba(10,31,61,0.06),0 2px 4px rgba(0,0,0,0.03);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.5;}
  .m-serif{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--amber);}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px 60px;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:22px 0;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:26px;height:26px;border-radius:7px;background:var(--navy);display:flex;align-items:center;justify-content:center;}
  .brand .mark::after{content:'';width:11px;height:11px;border:2px solid var(--amber);border-radius:50%;}
  .brand .wm{font-family:var(--font);font-weight:900;font-size:16px;letter-spacing:-0.06em;color:var(--navy);}
  .logo{display:block;flex:none;}
  .brand .pg{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink-3);padding-left:10px;margin-left:6px;border-left:1px solid var(--line);}
  .top .date{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.06em;}

  h1{font-size:38px;font-weight:800;letter-spacing:-.025em;margin:32px 0 6px;line-height:1.05;}
  .sub{color:var(--ink-2);font-size:15.5px;margin:0 0 28px;}

  .layout{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start;}
  @media(max-width:820px){.layout{grid-template-columns:1fr;}}

  /* roster */
  .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden;}
  .card-h{padding:16px 20px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);}
  .rec{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s;}
  .rec:last-child{border-bottom:none;}
  .rec:hover{background:var(--paper);}
  .rec.sel{background:#fbf6ea;box-shadow:inset 3px 0 0 var(--amber);}
  .av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;}
  .rec.sel .av{background:var(--amber-d);}
  .rec .nm{font-weight:700;font-size:15px;color:var(--navy);}
  .rec .rl{font-size:12.5px;color:var(--ink-3);}
  .rec .rev{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--forest);}

  /* detail */
  .detail{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:26px 28px;}
  .dhead{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:22px;}
  .dhead .av{width:56px;height:56px;font-size:20px;}
  .dhead .nm{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--navy);}
  .dhead .rl{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:2px;}
  .period{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--paper);border:1px solid var(--line);padding:7px 12px;border-radius:100px;}

  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:26px;}
  @media(max-width:680px){.stats{grid-template-columns:1fr 1fr;}}
  .tile{border:1px solid var(--line);border-radius:14px;padding:15px 16px;}
  .tile.gold{border-top:3px solid var(--amber);}
  .tile .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);}
  .tile .v{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:6px;color:var(--navy);}
  .tile .v.rev{color:var(--forest);}

  .block-h{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);margin:0 0 12px;}
  .sub-list{list-style:none;padding:0;margin:0 0 24px;}
  .sub-list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .sub-list li:last-child{border-bottom:none;}
  .badge{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--navy);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 9px;flex:none;}
  .sub-list .job{flex:1;font-size:14.5px;}
  .sub-list .job b{color:var(--navy);}
  .sub-list .out{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:100px;}
  .out.placed{background:#eef3ee;color:var(--forest);border:1px solid #d5e2d5;}
  .out.review{background:#fbf6ea;color:var(--amber-d);border:1px solid #eadfc4;}
  .out.pass{background:var(--paper);color:var(--ink-2);border:1px solid var(--line);}
  .foot{text-align:center;color:var(--ink-3);font-family:var(--mono);font-size:11px;letter-spacing:.05em;margin-top:34px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><svg class="logo" viewBox="0 0 100 100" width="26" height="26"><rect width="100" height="100" rx="28" fill="#0A1F3D"/><rect x="14" y="38" width="72" height="24" rx="3" fill="#fff"/><circle cx="72" cy="50" r="9" fill="#C2A24C"/><circle cx="72" cy="50" r="5" fill="#0A1F3D"/><circle cx="72" cy="50" r="2" fill="#C2A24C"/></svg><span class="wm">SPYGLASS MATRIX</span><span class="pg">Management</span></div>
    <div class="date">AUG 3, 2026</div>
  </div>

  <p class="sub" style="margin-top:30px;">Click any recruiter to see their activity, submissions, placements, and revenue.</p>

  <div class="layout">
    <div class="card">
      <div class="card-h">The Team · Q3</div>
      <div id="roster"></div>
    </div>

    <div class="detail" id="detail"></div>
  </div>

  <div class="foot">Spyglass Matrix · management view · Q3 2026</div>
</div>

<script>
  var TEAM = {
    marcos: {
      name:'Marcos Cuellar', initials:'MC', role:'Senior Recruiter',
      calls:42, meetings:11, submitted:9, filled:3, revenue:'$142,000',
      subs:[
        {n:3, job:'Technical Product Manager', client:'Northwind Cloud', out:'placed'},
        {n:2, job:'Senior Product Manager', client:'Vantage Labs', out:'review'},
        {n:2, job:'Staff Software Engineer', client:'Helio Systems', out:'review'},
        {n:2, job:'Product Designer', client:'Northwind Cloud', out:'pass'}
      ]
    },
    dana: {
      name:'Mike Chapman', initials:'MC', role:'Account Manager',
      calls:31, meetings:14, submitted:6, filled:2, revenue:'$98,500',
      subs:[
        {n:2, job:'Engineering Manager', client:'Brightpath AI', out:'placed'},
        {n:3, job:'Backend Engineer', client:'Vantage Labs', out:'review'},
        {n:1, job:'QA Lead', client:'Helio Systems', out:'pass'}
      ]
    },
    rob: {
      name:'Luke Gendron', initials:'LG', role:'Recruiter',
      calls:27, meetings:8, submitted:5, filled:1, revenue:'$61,000',
      subs:[
        {n:2, job:'Data Platform Lead', client:'Cobalt Software', out:'review'},
        {n:2, job:'Frontend Engineer', client:'Brightpath AI', out:'placed'},
        {n:1, job:'Product Analyst', client:'Northwind Cloud', out:'pass'}
      ]
    }
  };
  var OUT = {placed:'Placed', review:'In review', pass:'Passed'};

  function roster(){
    var h='';
    for(var k in TEAM){var t=TEAM[k];
      h+='<div class="rec" data-k="'+k+'" onclick="select(\''+k+'\')">'
        +'<span class="av">'+t.initials+'</span>'
        +'<div><div class="nm">'+t.name.split(' ')[0]+'</div><div class="rl">'+t.role+'</div></div>'
        +'<span class="rev">'+t.revenue+'</span></div>';
    }
    document.getElementById('roster').innerHTML=h;
  }
  function select(k){
    var t=TEAM[k];
    [].forEach.call(document.querySelectorAll('.rec'),function(r){r.classList.toggle('sel',r.getAttribute('data-k')===k);});
    var subs='';
    t.subs.forEach(function(s){
      subs+='<li><span class="badge">'+s.n+' →</span><span class="job"><b>'+s.job+'</b> · '+s.client+'</span>'
        +'<span class="out '+s.out+'">'+OUT[s.out]+'</span></li>';
    });
    document.getElementById('detail').innerHTML=
      '<div class="dhead"><span class="av">'+t.initials+'</span>'
      +'<div><div class="nm">'+t.name+'</div><div class="rl">'+t.role+'</div></div>'
      +'<span class="period">Quarter to date</span></div>'
      +'<div class="stats">'
      +'<div class="tile"><div class="k">Clients Called</div><div class="v">'+t.calls+'</div></div>'
      +'<div class="tile"><div class="k">Client Meetings</div><div class="v">'+t.meetings+'</div></div>'
      +'<div class="tile"><div class="k">Candidates Submitted</div><div class="v">'+t.submitted+'</div></div>'
      +'<div class="tile"><div class="k">Jobs Filled</div><div class="v">'+t.filled+'</div></div>'
      +'<div class="tile gold"><div class="k">Revenue</div><div class="v rev">'+t.revenue+'</div></div>'
      +'</div>'
      +'<div class="block-h">Submissions by job</div>'
      +'<ul class="sub-list">'+subs+'</ul>';
  }
  roster();
  select('marcos');
</script>
</body>
</html>
